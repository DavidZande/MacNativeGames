name: Bug report
description: Something does not build, crashes, renders wrongly or runs slowly.
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or link game files, keys, firmware or a built app; such issues are removed. Logs are fine,
        but remove anything that looks like a key first. See [LEGAL.md](https://github.com/DavidZande/MacNativeGames/blob/performance/LEGAL.md).
  - type: checkboxes
    id: legal
    attributes:
      label: Confirmation
      options:
        - label: I own the game and dumped the game file and keys myself from my own console.
          required: true
        - label: This issue contains no game files, keys or firmware, and no links to them.
          required: true
  - type: input
    id: version
    attributes:
      label: Game version and Mac
      placeholder: 1.0.0, MacBook Pro M1 Pro 16 GB, macOS 27.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build or runtime log (optional)
      render: text
