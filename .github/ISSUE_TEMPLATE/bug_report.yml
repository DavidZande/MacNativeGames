name: Bug report
description: Something does not build, crashes, renders wrongly or runs slowly.
body:
  - type: checkboxes
    id: legal
    attributes:
      label: Before you post
      options:
        - label: I own the game, and this issue contains no game files, keys or firmware, nor links to them.
          required: true
  - type: input
    id: version
    attributes:
      label: Game version and Mac
      placeholder: 1.0.0, MacBook Pro M1 Pro 16 GB, macOS 27.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log (optional)
      render: text
